openapi: 3.1.0
info:
  title: P05 Bottleneck Detection — Draft API Contract
  version: 0.1.0
  description: Working proposal, NOT an approved or implemented API. Read-only exchange requires prior human publication
    approval.
servers:
- url: http://localhost:8000
  description: Illustrative local development host only
security:
- bearerAuth: []
tags:
- name: Ingestion
- name: Analysis
- name: Governance
- name: Exchange
paths:
  /api/v1/datasets:
    post:
      summary: Upload and profile an event log
      operationId: uploadDataset
      tags:
      - Ingestion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - format
              properties:
                file:
                  type: string
                  format: binary
                format:
                  type: string
                  enum:
                  - csv
                  - xes
                  - ocel
      responses:
        '201':
          description: Dataset accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/datasets/{dataset_id}/profile:
    get:
      summary: Inspect deterministic profiling and quality checks
      operationId: getDatasetProfile
      tags:
      - Ingestion
      parameters:
      - $ref: '#/components/parameters/datasetId'
      responses:
        '200':
          description: Source profile, column stats and warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/datasets/{dataset_id}/mapping:
    put:
      summary: Human confirms a semantic mapping
      operationId: confirmMapping
      tags:
      - Ingestion
      parameters:
      - $ref: '#/components/parameters/datasetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingConfirmation'
      responses:
        '200':
          description: Confirmed mapping version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingConfirmed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/analyses:
    post:
      summary: Start deterministic discovery and detection
      operationId: startAnalysis
      tags:
      - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRequest'
      responses:
        '202':
          description: Analysis accepted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/analyses/{analysis_id}/status:
    get:
      summary: Poll analysis execution status
      operationId: getAnalysisStatus
      tags:
      - Analysis
      parameters:
      - $ref: '#/components/parameters/analysisId'
      responses:
        '200':
          description: Job state and publication state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/analyses/{analysis_id}/result:
    get:
      summary: Read deterministic result, including draft, for authorized users
      operationId: getInternalAnalysisResult
      tags:
      - Analysis
      parameters:
      - $ref: '#/components/parameters/analysisId'
      responses:
        '200':
          description: Full analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/analyses/{analysis_id}/publish:
    post:
      summary: Human reviewer approves result publication
      operationId: publishAnalysis
      tags:
      - Governance
      parameters:
      - $ref: '#/components/parameters/analysisId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/exchange/analyses/{analysis_id}:
    get:
      summary: Read a published report for P06/P20/P17/P21 or MCP read-only adapter
      operationId: getPublishedAnalysisResult
      tags:
      - Exchange
      parameters:
      - $ref: '#/components/parameters/analysisId'
      responses:
        '200':
          description: Published result only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque or JWT
  parameters:
    datasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
    analysisId:
      name: analysis_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content: &id001
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Upload too large
      content: *id001
    NotFound:
      description: Not found or not visible to caller
      content: *id001
    Unprocessable:
      description: Semantic validation failed
      content: *id001
    Forbidden:
      description: Insufficient permission
      content: *id001
    Conflict:
      description: Invalid operation for current workflow state
      content: *id001
  schemas:
    AnalysisResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: P05 Analysis Result v0.1.0
      description: Proposed exchange contract. Evidence-based findings are distinct from AI hypotheses and simulation
        estimates.
      type: object
      additionalProperties: false
      required:
      - schema_version
      - analysis_id
      - created_at
      - result_revision
      - publication_status
      - source
      - time_capabilities
      - process_model
      - metrics
      - findings
      - ai_interpretations
      - scenarios
      - provenance
      - warnings
      properties:
        schema_version:
          const: 0.1.0
        analysis_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        result_revision:
          type: integer
          minimum: 1
        publication_status:
          type: string
          enum:
          - draft
          - published
          - rejected
        source:
          $ref: '#/components/schemas/AnalysisResult/$defs/Source'
        time_capabilities:
          $ref: '#/components/schemas/AnalysisResult/$defs/TimeCapabilities'
        process_model:
          $ref: '#/components/schemas/AnalysisResult/$defs/ProcessModel'
        metrics:
          $ref: '#/components/schemas/AnalysisResult/$defs/Metrics'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResult/$defs/Finding'
        ai_interpretations:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResult/$defs/AIInterpretation'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResult/$defs/ScenarioEstimate'
        provenance:
          $ref: '#/components/schemas/AnalysisResult/$defs/Provenance'
        review:
          $ref: '#/components/schemas/AnalysisResult/$defs/HumanReview'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResult/$defs/Warning'
      allOf:
      - if:
          properties:
            publication_status:
              const: published
          required:
          - publication_status
        then:
          required:
          - review
      $defs:
        Stat:
          type: object
          additionalProperties: false
          required:
          - n
          - mean
          - p50
          - p90
          properties:
            n:
              type: integer
              minimum: 1
            mean:
              type: number
              minimum: 0
            p50:
              type: number
              minimum: 0
            p90:
              type: number
              minimum: 0
        Source:
          type: object
          additionalProperties: false
          required:
          - dataset_id
          - format
          - synthetic_example
          - event_count
          - case_count
          - fingerprint_sha256
          - mapping_version
          - time_zone
          - timestamp_semantics
          properties:
            dataset_id:
              type: string
              minLength: 1
            format:
              enum:
              - csv
              - xes
              - ocel
            synthetic_example:
              type: boolean
            event_count:
              type: integer
              minimum: 1
            case_count:
              type: integer
              minimum: 1
              description: Count is meaningful only after a case notion/object type has been selected.
            object_type:
              type: string
              minLength: 1
              description: Required by semantic policy for an OCEL projection.
            fingerprint_sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
            window_start:
              type: string
              format: date-time
            window_end:
              type: string
              format: date-time
            mapping_version:
              type: string
              minLength: 1
            time_zone:
              type: string
              minLength: 1
            timestamp_semantics:
              enum:
              - completion_only
              - start_and_completion
              - queue_arrival_and_service_start
              - mixed_with_metadata
          allOf:
          - if:
              properties:
                format:
                  const: ocel
              required:
              - format
            then:
              required:
              - object_type
        Capability:
          type: object
          additionalProperties: false
          required:
          - available
          - reason
          properties:
            available:
              type: boolean
            method:
              type: string
            reason:
              type: string
              minLength: 1
        TimeCapabilities:
          type: object
          additionalProperties: false
          required:
          - observed_inter_event_gap
          - processing_time
          - queue_wait_time
          - queue_length
          properties:
            observed_inter_event_gap:
              $ref: '#/components/schemas/AnalysisResult/$defs/Capability'
            processing_time:
              $ref: '#/components/schemas/AnalysisResult/$defs/Capability'
            queue_wait_time:
              $ref: '#/components/schemas/AnalysisResult/$defs/Capability'
            queue_length:
              $ref: '#/components/schemas/AnalysisResult/$defs/Capability'
        Edge:
          type: object
          additionalProperties: false
          required:
          - from
          - to
          - count
          properties:
            from:
              type: string
            to:
              type: string
            count:
              type: integer
              minimum: 1
            observed_inter_event_gap_seconds:
              $ref: '#/components/schemas/AnalysisResult/$defs/Stat'
            queue_wait_time_seconds:
              $ref: '#/components/schemas/AnalysisResult/$defs/Stat'
        ProcessModel:
          type: object
          additionalProperties: false
          required:
          - type
          - nodes
          - edges
          properties:
            type:
              const: dfg
            nodes:
              type: array
              uniqueItems: true
              items:
                type: string
                minLength: 1
            edges:
              type: array
              items:
                $ref: '#/components/schemas/AnalysisResult/$defs/Edge'
        Metrics:
          type: object
          additionalProperties: false
          required:
          - rework_events
          properties:
            observed_case_span_seconds:
              $ref: '#/components/schemas/AnalysisResult/$defs/Stat'
            rework_events:
              type: integer
              minimum: 0
        Target:
          type: object
          additionalProperties: false
          required:
          - kind
          properties:
            kind:
              enum:
              - transition
              - activity
              - resource
            activity:
              type: string
            from_activity:
              type: string
            to_activity:
              type: string
            resource_id:
              type: string
        Evidence:
          type: object
          additionalProperties: false
          required:
          - metric_name
          - value
          - unit
          - sample_size
          - aggregation
          - method
          properties:
            metric_name:
              enum:
              - observed_inter_event_gap_seconds
              - processing_time_seconds
              - queue_wait_time_seconds
              - queue_length_units
              - rework_ratio
            value:
              type: number
              minimum: 0
            unit:
              enum:
              - seconds
              - units
              - ratio
            sample_size:
              type: integer
              minimum: 1
            aggregation:
              enum:
              - mean
              - median
              - p90
              - max
              - count
              - ratio
            method:
              type: string
              minLength: 1
            reference_value:
              type: number
              minimum: 0
            threshold_rule:
              type: string
        Finding:
          type: object
          additionalProperties: false
          required:
          - finding_id
          - rank
          - finding_type
          - severity
          - target
          - evidence
          - expert_assessment
          - limitations
          properties:
            finding_id:
              type: string
              minLength: 1
            rank:
              type: integer
              minimum: 1
            finding_type:
              enum:
              - delay_hotspot
              - queue_congestion_candidate
              - capacity_bottleneck_candidate
              - rework_hotspot
            severity:
              enum:
              - unrated
              - low
              - moderate
              - high
              - critical
            target:
              $ref: '#/components/schemas/AnalysisResult/$defs/Target'
            evidence:
              $ref: '#/components/schemas/AnalysisResult/$defs/Evidence'
            expert_assessment:
              enum:
              - not_reviewed
              - confirmed
              - rejected
              - needs_investigation
            limitations:
              type: array
              items:
                type: string
        DocumentCitation:
          type: object
          additionalProperties: false
          required:
          - document_id
          - document_version
          - passage_id
          properties:
            document_id:
              type: string
            document_version:
              type: string
            passage_id:
              type: string
        AIInterpretation:
          type: object
          additionalProperties: false
          required:
          - interpretation_id
          - kind
          - text
          - finding_ids
          - document_citations
          - model_id
          - prompt_version
          - human_validation
          properties:
            interpretation_id:
              type: string
            kind:
              enum:
              - explanation
              - hypothesis
              - countermeasure
              - documentation_answer
            text:
              type: string
              minLength: 1
            finding_ids:
              type: array
              items:
                type: string
            document_citations:
              type: array
              items:
                $ref: '#/components/schemas/AnalysisResult/$defs/DocumentCitation'
            model_id:
              type: string
            prompt_version:
              type: string
            human_validation:
              enum:
              - not_reviewed
              - accepted
              - rejected
        ScenarioEstimate:
          type: object
          additionalProperties: false
          required:
          - scenario_id
          - status
          - assumptions
          properties:
            scenario_id:
              type: string
            status:
              enum:
              - proposed
              - simulated
            assumptions:
              type: array
              items:
                type: string
            simulator:
              enum:
              - simpy
            replications:
              type: integer
              minimum: 1
            random_seed:
              type: integer
            estimated_metrics:
              type: object
              additionalProperties:
                type: number
              description: Output is a conditional simulation estimate, never an observed measurement.
        Provenance:
          type: object
          additionalProperties: false
          required:
          - pipeline_version
          - pm4py_version
          - detector_version
          - ruleset_id
          - mapping_approved_at
          properties:
            pipeline_version:
              type: string
              minLength: 1
            pm4py_version:
              type: string
              minLength: 1
            detector_version:
              type: string
              minLength: 1
            ruleset_id:
              type: string
              minLength: 1
            mapping_approved_at:
              type: string
              format: date-time
            ai_runtime_version:
              type: string
            correlation_id:
              type: string
        HumanReview:
          type: object
          additionalProperties: false
          required:
          - reviewer_id
          - reviewed_at
          - scope
          properties:
            reviewer_id:
              type: string
              minLength: 1
            reviewed_at:
              type: string
              format: date-time
            scope:
              enum:
              - publication_approval
              - expert_finding_validation
            comments:
              type: string
        Warning:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              pattern: ^[A-Z_]+$
            message:
              type: string
              minLength: 1
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - trace_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z_]+$
        detail:
          type: string
        trace_id:
          type: string
        instance:
          type: string
        invalid_params:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
    DatasetAccepted:
      type: object
      required:
      - dataset_id
      - format
      - state
      properties:
        dataset_id:
          type: string
        format:
          enum:
          - csv
          - xes
          - ocel
        state:
          const: profile_ready
    DatasetProfile:
      type: object
      required:
      - dataset_id
      - columns
      - event_count
      - warnings
      properties:
        dataset_id:
          type: string
        event_count:
          type: integer
          minimum: 0
        columns:
          type: array
          items:
            type: object
            required:
            - name
            - data_type
            - missing_count
            properties:
              name:
                type: string
              data_type:
                type: string
              missing_count:
                type: integer
                minimum: 0
        warnings:
          type: array
          items:
            type: string
    MappingConfirmation:
      type: object
      additionalProperties: false
      required:
      - mapping_kind
      - activity_column
      - timestamp_column
      - human_confirmed
      allOf:
      - if:
          properties:
            mapping_kind:
              const: case_centric
          required:
          - mapping_kind
        then:
          required:
          - case_id_column
      - if:
          properties:
            mapping_kind:
              const: ocel_projection
          required:
          - mapping_kind
        then:
          required:
          - ocel_case_object_type
      properties:
        mapping_kind:
          enum:
          - case_centric
          - ocel_projection
        case_id_column:
          type: string
        activity_column:
          type: string
        timestamp_column:
          type: string
        lifecycle_column:
          type: string
        resource_column:
          type: string
        human_confirmed:
          const: true
        ocel_case_object_type:
          type: string
          description: Required by semantic policy if the source is OCEL.
    MappingConfirmed:
      type: object
      required:
      - dataset_id
      - mapping_version
      - approved_by
      - approved_at
      properties:
        dataset_id:
          type: string
        mapping_version:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
    StartAnalysisRequest:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - mapping_version
      properties:
        dataset_id:
          type: string
        mapping_version:
          type: string
        ruleset_id:
          type: string
        time_window:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
    AnalysisStatus:
      type: object
      additionalProperties: false
      required:
      - analysis_id
      - run_status
      - publication_status
      properties:
        analysis_id:
          type: string
          format: uuid
        run_status:
          enum:
          - queued
          - running
          - completed
          - failed
        publication_status:
          enum:
          - draft
          - published
          - rejected
        error_code:
          type: string
    PublishRequest:
      type: object
      additionalProperties: false
      required:
      - expected_result_revision
      - approve
      properties:
        expected_result_revision:
          type: integer
          minimum: 1
        approve:
          const: true
        comment:
          type: string
    PublishedResponse:
      type: object
      required:
      - analysis_id
      - publication_status
      - published_at
      - result_revision
      properties:
        analysis_id:
          type: string
          format: uuid
        publication_status:
          const: published
        published_at:
          type: string
          format: date-time
        result_revision:
          type: integer
          minimum: 1
